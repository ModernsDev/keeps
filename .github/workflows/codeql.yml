name: CodeQL Advanced

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-24.04
            build_mode: none
          - language: python
            runner: ubuntu-24.04
            build_mode: none
          - language: rust
            runner: ubuntu-24.04
            build_mode: none
          - language: swift
            runner: macos-15
            build_mode: manual
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Select Xcode for Swift extraction
        if: matrix.language == 'swift'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer' >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
      - name: Build macOS, iOS Simulator and ColorTools for Swift extraction
        if: matrix.language == 'swift'
        run: |
          xcodebuild -project macos/Keeps.xcodeproj -scheme Keeps -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath .build/codeql-macos \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_USE_INTEGRATED_DRIVER=NO build
          xcodebuild -project ios/KeepsIOS.xcodeproj -scheme KeepsIOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/codeql-ios \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO COMPILATION_CACHE_ENABLE_CACHING=NO SWIFT_USE_INTEGRATED_DRIVER=NO build
          swift build --package-path macos/ColorTools --arch arm64 --scratch-path .build/codeql-color
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
