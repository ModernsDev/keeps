name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Changed components
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      server: ${{ steps.scope.outputs.server }}
      python: ${{ steps.scope.outputs.python }}
      shared: ${{ steps.scope.outputs.shared }}
      macos: ${{ steps.scope.outputs.macos }}
      ios: ${{ steps.scope.outputs.ios }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_scope.py

  checks:
    name: Repository and release scripts
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Scan repository for secrets
        run: |
          brew install gitleaks
          gitleaks dir . --redact --no-banner
      - run: python macos/scripts/test_pre_merge_gate.py
      - run: python macos/scripts/test_bundle_ai_runtime.py
      - run: python -m unittest discover -s scripts -p 'test_ci_*.py'
      - name: Test release scripts without credentials
        run: |
          python -m pip install 'PyJWT[crypto]>=2.10,<3'
          bash -n scripts/testflight.sh
          python scripts/test_app_store_connect.py

  server:
    name: Rust server
    needs: scope
    if: needs.scope.outputs.server == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Rust cache identity
        id: rust
        run: echo "version=$(rustc +stable --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('server/Cargo.lock') }}-${{ hashFiles('server/Cargo.toml', 'server/src/**', 'server/tests/**') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('server/Cargo.lock') }}-
      - run: cargo +stable fmt --manifest-path server/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path server/Cargo.toml --locked --all-targets -- -D warnings
      - name: Install video metadata test dependencies
        timeout-minutes: 2
        env:
          FFMPEG_VERSION: 8.1.3-2
          FFMPEG_SHA256: 1df84d04c4322902dba81c290508cdf3d89524d210b9fe03154bea6c4e3bfbb6
        run: |
          archive="$RUNNER_TEMP/ffmpeg.tar.xz"
          bin_dir="$RUNNER_TEMP/ffmpeg-bin"
          curl --fail --silent --show-error --location --retry 2 --max-time 45 --retry-max-time 75 \
            --output "$archive" \
            "https://github.com/jellyfin/jellyfin-ffmpeg/releases/download/v${FFMPEG_VERSION}/jellyfin-ffmpeg_${FFMPEG_VERSION}_portable_linux64-gpl.tar.xz"
          printf '%s  %s\n' "$FFMPEG_SHA256" "$archive" | sha256sum --check -
          mkdir -p "$bin_dir"
          tar -xJf "$archive" -C "$bin_dir" ffmpeg ffprobe
          test -x "$bin_dir/ffmpeg"
          test -x "$bin_dir/ffprobe"
          echo "$bin_dir" >> "$GITHUB_PATH"
      - run: cargo +stable test --manifest-path server/Cargo.toml --locked

  shared:
    name: Shared Swift
    needs: scope
    if: needs.scope.outputs.shared == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            shared/.build
          key: swift-shared-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('shared/**/*.swift', 'shared/Package.resolved') }}
          restore-keys: |
            swift-shared-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - run: swift test --package-path shared

  macos:
    name: macOS
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Identify SwiftPM build products
        id: swiftpm
        run: |
          xcode="$(xcodebuild -version)"
          sdk="$(xcrun --sdk macosx --show-sdk-build-version)"
          workspace="$(pwd -P)"
          identity="$(printf '%s\n' "$xcode" "$sdk" "$workspace" | shasum -a 256 | cut -d ' ' -f 1)"
          macos="$(swift build --package-path macos --arch arm64 --show-bin-path)"
          color="$(swift build --package-path macos/ColorTools --arch arm64 --show-bin-path)"
          printf 'identity=%s\nmacos=%s\ncolor=%s\n' "$identity" "$macos" "$color" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: macos-products
        with:
          path: |
            ${{ steps.swiftpm.outputs.macos }}/PhotoAssetManager
            ${{ steps.swiftpm.outputs.macos }}/PhotoAssetManagerPackageTests.xctest
            ${{ steps.swiftpm.outputs.macos }}/KeepsAPI_KeepsAPI.bundle
          key: swiftpm-macos-products-${{ runner.arch }}-${{ steps.swiftpm.outputs.identity }}-${{ hashFiles('macos/Package.*', 'macos/Sources/**', 'macos/Tests/**', 'shared/Package.*', 'shared/Sources/**') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: color-products
        with:
          path: |
            ${{ steps.swiftpm.outputs.color }}/keeps-color-mcp
            ${{ steps.swiftpm.outputs.color }}/KeepsColorToolsPackageTests.xctest
          key: swiftpm-color-products-${{ runner.arch }}-${{ steps.swiftpm.outputs.identity }}-${{ hashFiles('macos/ColorTools/Package.*', 'macos/ColorTools/Sources/**', 'macos/ColorTools/Tests/**') }}
      - run: swift test --package-path macos --arch arm64 ${{ steps.macos-products.outputs.cache-hit == 'true' && '--skip-build' || '' }}
      - run: swift test --package-path macos/ColorTools --arch arm64 ${{ steps.color-products.outputs.cache-hit == 'true' && '--skip-build' || '' }}
      - env:
          MACOS_PRODUCTS: ${{ steps.swiftpm.outputs.macos }}
        run: bash macos/scripts/package_app.sh "$MACOS_PRODUCTS"

  macos_xcode:
    name: macOS Xcode build
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/xcode-macos-ci
          key: xcode-macos-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('macos/**/*.swift', 'macos/**/Package.resolved', 'shared/**/*.swift', 'shared/Package.resolved', 'macos/**/*.pbxproj', 'macos/Version.xcconfig') }}
          restore-keys: |
            xcode-macos-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - name: Build macOS Xcode app
        run: xcodebuild -project macos/Keeps.xcodeproj -scheme Keeps -configuration Debug -destination 'generic/platform=macOS' -derivedDataPath .build/xcode-macos-ci CODE_SIGNING_ALLOWED=NO build

  ios:
    name: iOS
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ios/.build
          key: swift-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('ios/**/*.swift', 'ios/**/Package.resolved', 'shared/**/*.swift', 'shared/Package.resolved') }}
          restore-keys: |
            swift-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - run: swift test --package-path ios

  ios_xcode:
    name: iOS Simulator build
    needs: scope
    if: needs.scope.outputs.ios == 'true'
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/xcode-ios-ci
          key: xcode-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('ios/**/*.swift', 'ios/**/Package.resolved', 'shared/**/*.swift', 'shared/Package.resolved', 'ios/**/*.pbxproj', 'ios/Version.xcconfig') }}
          restore-keys: |
            xcode-ios-${{ runner.os }}-${{ runner.arch }}-xcode26.3-
      - name: Build iOS Simulator
        run: xcodebuild -project ios/KeepsIOS.xcodeproj -scheme KeepsIOS -destination 'generic/platform=iOS Simulator' -derivedDataPath .build/xcode-ios-ci CODE_SIGNING_ALLOWED=NO build

  python:
    name: Control plane and migration tools
    needs: scope
    if: needs.scope.outputs.python == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e './control_plane[test]'
      - run: python -m pytest
        working-directory: control_plane
      - run: python -m unittest discover -s scripts -p 'test_migrate_nas_paths.py'
      - run: python -m unittest discover -s scripts -p 'test_migrate_nas_storage.py'
      - run: python -m unittest discover -s scripts -p 'test_merge_tracked_folders.py'
      - name: Install Rust for schema integration tests
        run: rustup toolchain install stable --profile minimal
      - name: Rust cache identity
        id: rust
        run: echo "version=$(rustc +stable --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            server/target
          key: rust-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('server/Cargo.lock') }}-${{ hashFiles('server/Cargo.toml', 'server/src/**') }}
          restore-keys: |
            rust-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.version }}-${{ hashFiles('server/Cargo.lock') }}-
      - name: Build server for schema integration tests
        run: cargo +stable build --manifest-path server/Cargo.toml --locked --bin keeps-server
      - run: python -m unittest discover -s scripts -p 'test_backfill_standard_names.py'
      - run: python -m unittest discover -s scripts -p 'test_linux_cache_worker.py'
      - run: python -m unittest discover -s deploy/spk -p 'test_*.py'

  keeps-ci-gate:
    name: keeps-ci-gate
    if: ${{ always() }}
    needs: [scope, checks, server, shared, macos, macos_xcode, ios, ios_xcode, python]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs for the change scope
        env:
          CI_JOBS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          jobs = json.loads(os.environ["CI_JOBS"])
          failures = []
          for name in ("scope", "checks"):
              result = jobs[name]["result"]
              if result != "success":
                  failures.append(f"{name}: expected success, got {result}")

          scope = jobs["scope"]["outputs"]
          for name in ("server", "shared", "macos", "macos_xcode", "ios", "ios_xcode", "python"):
              required = scope.get(name.removesuffix("_xcode"))
              if required not in {"true", "false"}:
                  failures.append(f"{name}: invalid scope {required!r}")
                  continue
              expected = "success" if required == "true" else "skipped"
              result = jobs[name]["result"]
              if result != expected:
                  failures.append(f"{name}: expected {expected}, got {result}")

          if failures:
              raise SystemExit("\n".join(failures))
          PY
